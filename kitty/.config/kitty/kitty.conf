# Theming
include ~/.local/state/quickshell/user/generated/terminal/kitty-theme.conf

# Font
font_family      JetBrains Mono Nerd Font
font_size 11.0
# A bit of line spacing for readability
modify_font cell_height 110%

# Cursor
cursor_shape beam
cursor_trail 1

# Padding (why weird value? consistency with foot)
window_margin_width 21.75

# No stupid close confirmation
confirm_os_window_close 0

# Use fish shell
shell fish

# Copy
map ctrl+c    copy_or_interrupt

# Search
map ctrl+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0

# Tabs / layouts (mirrors the Mac setup)
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round
tab_title_template "{index}: {title}"
enabled_layouts horizontal, stack
inactive_text_alpha 0.7
scrollback_lines 10000
scrollback_pager_history_size 50

map kitty_mod+enter launch --cwd=current
tab_bar_margin_height 6.0 0.0
active_tab_font_style bold
inactive_tab_font_style normal
window_border_width 1pt
# Border / tab colors come from the quickshell template
# (~/.config/quickshell/ii/scripts/colors/terminal/kitty-theme.conf), so they follow the wallpaper.
cursor_trail_decay 0.1 0.3
background_opacity 0.85
dynamic_background_opacity yes

# Quality of life
# Desktop notification when a command running >10s finishes in an unfocused window
notify_on_cmd_finish unfocused 10.0
# Drop trailing spaces when copying from non-rectangular selections
strip_trailing_spaces smart
url_style curly
show_hyperlink_targets yes
