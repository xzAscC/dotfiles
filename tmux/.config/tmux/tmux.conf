set-option -g default-shell /usr/bin/fish

# Prefix: Ctrl-a instead of Ctrl-b (press Ctrl-a twice to send a literal Ctrl-a)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Mouse: wheel scrolls history, click selects pane/window, drag resizes panes
set -g mouse on

# Keep 50k lines of scrollback per pane
set -g history-limit 50000

# Number windows and panes from 1; renumber after closing one
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Colors: 256-color + truecolor inside kitty
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"

# No delay after Esc (for vim/fish vi keys)
set -sg escape-time 10

# Let nvim see focus changes (autoread, gitsigns refresh)
set -g focus-events on

# Pass kitty graphics protocol through (snacks.nvim images)
set -g allow-passthrough on

# Forward modified keys (Ctrl-Enter, Shift-Enter, C-i vs Tab) to apps that ask for them
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features ",xterm-kitty:extkeys"

# Let apps inside tmux set the system clipboard via OSC 52
set -s set-clipboard on

# Splits and new windows open in the current pane's directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Reload this file: prefix r
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Throwaway vs kept sessions
# Every kitty window gets its own session with destroy-unattached on (see
# fish config.fish), so closing the window kills it like a plain terminal.
# A session is "kept" (pinned) once destroy-unattached is off.
#
# Leaving a throwaway session in any way destroys it, switching included.
# So before switching away, pin it unless it's just an idle shell.
set -g @busy "#{||:#{!=:#{session_windows},1},#{||:#{!=:#{window_panes},1},#{!=:#{pane_current_command},fish}}}"
# prefix d: pin, then detach (the session keeps running in the background)
bind d { set-option destroy-unattached off ; detach-client }
# prefix k (keep): toggle pin. Lowercase on purpose: kitty sends Shift+letter as
# an extended key that tmux doesn't match against an uppercase binding.
bind k {
  if -F "#{==:#{destroy-unattached},on}" {
    set-option destroy-unattached off ; display "Pinned: kept after this window closes"
  } {
    set-option destroy-unattached on ; display "Unpinned: closes with this window"
  }
}
# Ctrl variants: keep Ctrl held after the prefix (C-a C-d) -- also immune to
# the Chinese IME (fcitx5), which swallows bare letters typed after the prefix
bind C-d { set-option destroy-unattached off ; detach-client }
bind C-k {
  if -F "#{==:#{destroy-unattached},on}" {
    set-option destroy-unattached off ; display "Pinned: kept after this window closes"
  } {
    set-option destroy-unattached on ; display "Unpinned: closes with this window"
  }
}
bind C-c new-window -c "#{pane_current_path}"
bind C-s { if -F "#{E:@busy}" { set-option destroy-unattached off } ; choose-tree -Zs }
# Session switching keys, guarded as above
bind s { if -F "#{E:@busy}" { set-option destroy-unattached off } ; choose-tree -Zs }
bind w { if -F "#{E:@busy}" { set-option destroy-unattached off } ; choose-tree -Zw }
bind ( { if -F "#{E:@busy}" { set-option destroy-unattached off } ; switch-client -p }
bind ) { if -F "#{E:@busy}" { set-option destroy-unattached off } ; switch-client -n }
bind L { if -F "#{E:@busy}" { set-option destroy-unattached off } ; switch-client -l }

# Status bar: palette indexes instead of hex, so colors follow the
# quickshell-generated terminal palette when the wallpaper changes.
#   colour0 background, colour2 accent, colour4 secondary accent,
#   colour7 foreground, colour8 dim text, colour252 secondaryContainer
set -g status-position bottom
set -g status-interval 15
set -g status-style "bg=default,fg=colour7"
set -g status-left-length 30
# Pin icon after the session name marks a kept session
set -g status-left "#[bg=colour2,fg=colour0,bold] #S#{?#{==:#{destroy-unattached},off}, ,} #[bg=default] "
set -g status-right-length 40
set -g status-right "#[fg=colour4]#h  #[fg=colour7]%H:%M "
setw -g window-status-format "#[fg=colour8] #I #W "
setw -g window-status-current-format "#[bg=colour252,fg=colour2,bold] #I #W#{?window_zoomed_flag, ⛶,} "
setw -g window-status-separator ""
set -g pane-border-style "fg=colour252"
set -g pane-active-border-style "fg=colour2"
set -g message-style "bg=colour252,fg=colour2"
set -g mode-style "bg=colour2,fg=colour0"
